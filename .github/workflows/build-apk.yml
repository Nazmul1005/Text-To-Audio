name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # Keystore credentials - set in GitHub Secrets
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Decode signing keystore
      env:
        KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE }}
      run: |
        echo "$KEYSTORE_FILE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
        echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Signed Release APK
      run: ./gradlew assembleRelease
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Signed Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Debug APK
      uses: actions/download-artifact@v4
      with:
        name: app-debug
        path: artifacts/debug

    - name: Download Signed Release APK
      uses: actions/download-artifact@v4
      with:
        name: app-release
        path: artifacts/release

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/debug/app-debug.apk
          artifacts/release/app-release.apk
        generate_release_notes: true
        draft: false
        prerelease: false

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Download Signed Release APK
      uses: actions/download-artifact@v4
      with:
        name: app-release
        path: artifacts/release

    - name: Setup Pages
      uses: actions/configure-pages@v4
      with:
        enablement: true

    - name: Prepare site
      run: |
        mkdir -p _site
        cp site/index.html _site/index.html
        cp artifacts/release/app-release.apk _site/app-release.apk

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: _site

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
